name: Bug report
description: Report a wrong result, a script or report that no longer builds, or a problem in the documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please do not report security vulnerabilities here: follow the [security policy](https://github.com/evrardlecureur/ProbaProjet/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Simple regression (code/script_romain.R)"
        - "Multiple and polynomial regression, ANOVA (code/script_thibaud.R)"
        - "Variable selection (code/script_evrard.R)"
        - "Report (rapport.tex) or figures"
        - "CI / GitHub Actions"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, from a fresh clone if possible.
      placeholder: |
        Rscript code/script_romain.R
        tectonic -X compile rapport.tex
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output and traceback
      description: Paste the relevant output. It is formatted as code automatically.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and tool versions.
      placeholder: "Windows 11, R 4.5.1, leaps 3.2, segmented 2.1"
